<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            /* you can give inline-block when you using display as inline in that the height and width will be permanent if you want to give height and widht give display : inline-block;
            instead of display:inline*/
            display: inline;
           
             /* height: 200px;
            width: 200px; */ /* these property are not working in inline element*/
        }
        span{
            display: block;
            border: 1px solid red;
             height: 200px;
             
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>welcome</h1>
    <h1>pyspiders</h1>
    <h1>pyspiders</h1>
    <h1>pyspiders</h1>
    <h1>pyspiders</h1>
    <hr>
    <span>welcome</span>
    <span>pyspiders</span>
    <span>pyspiders</span>
    <span>pyspiders</span>
    <span>pyspiders</span>
</body>
</html>
