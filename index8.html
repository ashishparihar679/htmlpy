<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body bgcolor="#F6F1DB">
    <form action="">
      <fieldset>
        <legend><h1>Student-Details</h1></legend>
        <fieldset>
          <legend><h2>Personal</h2></legend>

          
          <label for="">First Name:</label>
          <input type="text" placeholder="First Name" /> <br />
          <label for="">Last Name:</label>
          <input type="text" placeholder="Last Name" /> <br />
          <label for="">Father's name:</label>
          <input type="text" placeholder="Father's name" /> <br />
          <label for="">Mother's name:</label>
          <input type="text" placeholder="Mother's name" /> <br />
          <label for="">DOB:</label>
          <input type="date" />
          <br />
          <label for="">Gender:</label>
          <input type="radio" name="gender" />
          <label>Male</label>

          <input type="radio" name="gender" />
          <label>Female</label>

          <input type="radio" name="gender" />
          <label>Other</label>
          <br />
          <label for="">Blood Group:</label>
          <select name="" id="">
            <option value="" hidden>------------CHOOSE HERE-----------</option>
            <option value="">a positive</option>
            <option value="">b positive</option>
            <option value="">o positive</option>
          </select>
        </fieldset>
        <br />
        <fieldset>
          <legend><h2>Contact</h2></legend>

          <label for="">Mobile no:</label>
          <input type="tel" placeholder="10 Digits" />
          <br />

          <label for="">Mail id:</label>
          <input type="email" placeholder="Sample@gmail.com" />
          <br />

          <label for="">Address:</label>
          <input type="text" placeholder="House no, Street Name" />
          <br />

          <input type="text" placeholder="Line 1" />
          <input type="text" placeholder="Line 2" />
          <br />

          <label for="">Country:</label>
          <select name="" id="">
            <option value="" hidden>--------Choose--------</option>
            <option value="">India</option>
            <option value="">USA</option>
            <option value="">UK</option>
          </select>
          <br />

          <label for="">State:</label>
          <select name="" id="">
            <option value="" hidden>--------Choose--------</option>
            <option value="">Madhya Pradesh</option>
            <option value="">Maharashtra</option>
            <option value="">Delhi</option>
            <option value="">Karnataka</option>
          </select>
          <br />

          <label for="">Pin Code:</label>
          <input type="text" placeholder="" />
          <br />
        </fieldset>
        <br />
        <fieldset>
          <legend><h2>Education</h2></legend>

          <label for="">Highest Degree:</label>
          <select name="" id="">
            <option value="" hidden>--------Choose--------</option>
            <option value="">10th</option>
            <option value="">12th</option>
            <option value="">Diploma</option>
            <option value="">B.Tech</option>
            <option value="">BCA</option>
            <option value="">MCA</option>
            <option value="">M.Tech</option>
          </select>
          <br />

          <label for="">Stream:</label>

          <input type="radio" name="stream" />
          <label>Maths</label>

          <input type="radio" name="stream" />
          <label>Civil</label>

          <input type="radio" name="stream" />
          <label>CS</label>

          <input type="radio" name="stream" />
          <label>EC</label>

          <input type="radio" name="stream" />
          <label>IT</label>

          <input type="radio" name="stream" />
          <label>EEE</label>
          <br />

          <label for="">If Other:</label>
          <input type="text" />
          <br />

          <label for="">YOP:</label>
          <select name="" id="">
            <option value="" hidden>--------Choose--------</option>
            <option value="">2022</option>
            <option value="">2023</option>
            <option value="">2024</option>
            <option value="">2025</option>
            <option value="">2026</option>
          </select>
          <br />

          <label for="">University:</label>
          <input type="text" placeholder="University" />
          <br />

          <label for="">Percentage:</label>
          <input type="text" placeholder="Percentage" />
          <br />
        </fieldset>
        <br />
        <fieldset>
          <legend><h2>Placement</h2></legend>
          <label>Skills:</label>

          <input type="checkbox" />
          <label>HTML</label>

          <input type="checkbox" />
          <label>CSS</label>

          <input type="checkbox" />
          <label>JS</label>
          <br />

          <input type="checkbox" />
          <label>ReactJS</label>

          <input type="checkbox" />
          <label>React Native</label>

          <input type="checkbox" />
          <label>TensorFlowJS</label>

          <br />

          <input type="checkbox" />
          <label>NodeJS</label>

          <input type="checkbox" />
          <label>ElectronJS</label>

          <input type="checkbox" />
          <label>Redis</label>

          <br />

          <label>Domain:</label>
          <br />

          <input type="radio" name="domain" />
          <label>Devops</label>

          <input type="radio" name="domain" />
          <label>Testing</label>

          <input type="radio" name="domain" />
          <label>Dev</label>

          <input type="radio" name="domain" />
          <label>Support</label>

          <br />

          <label>Place of Preference:</label>
          <br />

          <input type="radio" name="place" />
          <label>Bangalore</label>

          <input type="radio" name="place" />
          <label>Chennai</label>

          <br />

          <input type="radio" name="place" />
          <label>Hyderabad</label>

          <input type="radio" name="place" />
          <label>Pune</label>

          <input type="radio" name="place" />
          <label>Delhi</label>

          <input type="radio" name="place" />
          <label>Pan India</label>

          <br />

          <label>Expected Salary:</label>
          <br />
          <input type="radio" name="salary" />
          <label>Less Than 3 LPA</label>

          <input type="radio" name="salary" />
          <label>3.6 LPA</label>

          <br />

          <input type="radio" name="salary" />
          <label>6-10 LPA</label>

          <input type="radio" name="salary" />
          <label>More than 10 LPA</label>

          <input type="radio" name="salary" />
          <label>No Expectation</label>
        </fieldset>
        <br />
        <fieldset>
          <legend><h2>Create Account</h2></legend>
          <label for="">Username</label>
          <input type="text" placeholder="Username" />
          <br />
          <label for="">password</label>
          <input type="text" />
          <br />
          <label for="">Re-Enter</label>

          <input type="text" />
          <br />

          <input type="checkbox" />
          <label for="">Agree Terms & Condition</label>
          <br />
          <input type="submit" value="login" />
          <input type="reset" value="Cancel" />
          <br />
        </fieldset>
      </fieldset>
    </form>
  </body>
</html>
